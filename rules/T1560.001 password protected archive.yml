title: Password-Protected Archive Creation via 7-Zip
id: d07bd6f1-a4e9-4cbc-bbcb-26765ed7bbac
status: experimental
description: >
  Detects creation of a password-protected archive using 7-Zip. Adversaries password
  protect staged data before exfiltration because encrypted archives defeat DLP content
  inspection, mail gateway scanning and network-level data classification. Note this is
  a low-specificity signal - password-protecting an archive is also normal end-user
  behaviour, and the command lines are identical. It is intended as a contributing
  signal for correlation with outbound transfer volume or unusual source file locations,
  not as a standalone alert.
references:
  - https://attack.mitre.org/techniques/T1560/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1560.001/T1560.001.md
author: Samuel Nwabunike
date: 2026/09/12
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\7z.exe'
      - '\7zG.exe'
      - '\7zFM.exe'
  selection_password:
    CommandLine|re: '(?i)\s-p\S'
  condition: all of selection_*
falsepositives:
  - Users password-protecting documents before emailing them externally
  - Backup scripts creating encrypted archives
  - Developers packaging builds with protected contents
  - Organisational policy mandating encryption before file transfer
level: low
