title: Scheduled Task Creation Running Script Interpreter
id: ddad15f6-b7d7-40c7-ada5-36b45e82ce49
status: experimental
description: >
  Detects creation of a Windows scheduled task whose action (/TR) launches a script
  interpreter or living-off-the-land binary. Adversaries use scheduled tasks for
  persistence and to execute payloads under a trusted parent process. Task creation
  alone is common in legitimate software, so this rule targets tasks specifically
  configured to run an interpreter.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
author: Samuel Nwabunike
date: 2026/09/10
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_create:
    CommandLine|contains: "/create"
  selection_interpreter:
    CommandLine|re: '(?i)/tr\s+[^\s]*(cmd\.exe|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32)'
  condition: all of selection_*
falsepositives:
  - Application installers and updaters scheduling wrapper scripts
  - Endpoint management tooling (SCCM, Intune, RMM agents)
  - Administrator maintenance scripts scheduled via cmd.exe wrappers
level: medium
